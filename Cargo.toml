[package]
name = "opl-backend"
version = "0.8.1"
edition = "2024"
license = "GPL-3"

[dependencies]
actix-web = "4.14.0"
serde = "1.0.229"
serde_json = "1.0.151"
argon2 = "0.6.0"
sha2 = "0.11.0"
base64 = "0.23.1"
rand = "0.10.2"
anyhow = "1.0.104"
thiserror = "2.0.19"
strum_macros = "0.28.0"
web-push = "0.11.0"

[dependencies.uuid]
version = "1.24.0"
features = ["v4"]

[dependencies.chrono]
version = "0.4.45"
features = ["serde"]

[dependencies.sqlx]
version = "0.9.0"
features = ["mysql", "runtime-tokio", "chrono", "uuid", "migrate"]

[dependencies.tokio]
version = "1.53.1"
features = ["macros", "rt-multi-thread"]