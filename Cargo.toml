[package]
name = "opl-backend"
version = "0.10.7"
edition = "2024"
license = "GPL-3"

[dependencies]
actix-web = "~4.17"
serde = "~1.0"
serde_json = "~1.0"
argon2 = "~0.6"
sha2 = "~0.11"
base64 = "~0.23"
rand = "~0.10"
anyhow = "~1.0"
thiserror = "~2.0"
strum_macros = "~0.28"
web-push = "~0.11"

[dependencies.uuid]
version = "~1.28"
features = ["v4"]

[dependencies.chrono]
version = "~0.4"
features = ["serde"]

[dependencies.sqlx]
version = "~0.9"
features = ["mysql", "runtime-tokio", "chrono", "uuid", "migrate"]

[dependencies.tokio]
version = "~1.54"
features = ["macros", "rt-multi-thread"]

[dependencies.pluralkit]
version = "~0.1.5"
default-features = false
features = ["members"]